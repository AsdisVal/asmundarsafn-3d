<!DOCTYPE html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garður Ásmundar í þrívídd</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="c" aria-label="3D Sculpture View"></canvas>

  <!-- Tooltip Elements -->
  <div id="tooltip" class="tooltip" role="tooltip"></div>
  <div id="radlagning" class="radlagning" role="tooltip"></div>

  <!-- Statue Info Panel -->
  <div id="info-panel" class="info-panel" aria-live="polite"></div>

  <!-- Modal Overlay -->
  <div id="statueModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="statueDesc">
    <div class="modal-content">

      <!-- Left Panel -->
      <div class="left-panel">
        <canvas id="statue3DCanvas" aria-label="3D View of Statue"></canvas>
        <img id="imageCard" src="image-card.png" alt="Rendering of the statue">
      </div>

      <!-- Right Panel -->
      <div class="right-panel">
        <img id="statuePhoto" src="" alt="Photo of the statue">
        <div id="statueDetails">
          <p id="statueDesc"></p>
          <p id="statueYear"></p>
        </div>
      </div>
    </div>

    <!-- Overview Button -->
    <button id="overviewBtn">Go to Overview</button>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
